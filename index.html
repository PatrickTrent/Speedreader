
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body { 
          font-family: 'Inter', sans-serif; 
          background-color: #0f172a; 
          color: white; 
          margin: 0;
        }
        .logo-speed {
            font-style: italic;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #ef4444 0%, #f87171 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            transform: skewX(-10deg);
            text-shadow: 2px 2px 10px rgba(239, 68, 68, 0.3);
        }
        input[type=range] { appearance: none; background: #334155; height: 8px; border-radius: 5px; }
        input[type=range]::-webkit-slider-thumb { appearance: none; width: 20px; height: 20px; background: #ef4444; border-radius: 50%; cursor: pointer; }
    </style>
